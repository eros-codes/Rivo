# Runs on every push and pull request. Three jobs, side by side:
#   checks  types, lint, the client's unit tests, the production build
#   api     the server against a real PostgreSQL (started here, thrown away after)
#   e2e     the built app in Chromium against the same kind of database
# A red job blocks merging once "main" is protected (Settings → Branches).
name: CI

on:
  push:
  pull_request:

# a newer push to the same branch cancels the run still going for the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the database client's types come from prisma/schema.prisma
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  api:
    name: API tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rivo
          POSTGRES_PASSWORD: rivo
          POSTGRES_DB: rivo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivo -d rivo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://rivo:rivo@localhost:5432/rivo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # (applies the migrations to the empty database first, like a real deploy)
      - run: npm run test:api

  e2e:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rivo
          POSTGRES_PASSWORD: rivo
          POSTGRES_DB: rivo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivo -d rivo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://rivo:rivo@localhost:5432/rivo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      # what the browser saw, when something failed: screenshots, traces, the report
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
