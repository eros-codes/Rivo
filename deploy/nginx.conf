# nginx in front of Rivo: the site's address, HTTPS (certbot adds it to this
# file), the live connection (WebSocket) and the client's real address.
# Installed by docs/DEPLOY.md (step "nginx"), with __DOMAIN__ replaced:
#   sed "s/__DOMAIN__/chat.example.com/g" deploy/nginx.conf | sudo tee /etc/nginx/sites-available/rivo

# "Connection: upgrade" for a request that asks to upgrade (the live
# connection), "close" for the rest (as nginx does by default)
map $http_upgrade $connection_upgrade {
	default upgrade;
	"" close;
}

server {
	listen 80;
	listen [::]:80;
	server_name __DOMAIN__;

	# a profile picture may be up to 5 MB (the app's limit), plus the form
	# around it; nginx's own default (1 MB) would refuse most photos
	client_max_body_size 6m;

	# compress the app's files on the way out (Rivo itself does not). Not
	# pages or API answers: those can carry private data next to text a
	# visitor controls, which compression can leak (BREACH)
	gzip on;
	gzip_types text/css application/javascript image/svg+xml application/manifest+json;
	gzip_min_length 1024;

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# Rivo reads the client's address from the last entry of X-Forwarded-For
		# (ENABLE_TRUST_PROXY=1): the one nginx adds here
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# the same id in nginx's log and Rivo's (Rivo keeps a proxy's id)
		proxy_set_header X-Request-Id $request_id;
		# the live connection: Socket.IO moves to a WebSocket
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		# (Socket.IO pings every 5 s, so an open connection is never idle this long)
		proxy_read_timeout 75s;
	}
}
