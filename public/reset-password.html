<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Rivo</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb; color: #1a1a2e; }
    .card { width: min(92vw, 420px); background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 12px 30px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { margin: 0 0 16px; line-height: 1.6; color: #556; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #dfe4ee; border-radius: 12px; margin-bottom: 12px; font: inherit; }
    button { width: 100%; padding: 12px 14px; border: 0; border-radius: 12px; background: #1a1a2e; color: #fff; cursor: pointer; font: inherit; font-weight: 600; }
    button:disabled { opacity: .7; cursor: not-allowed; }
    .message { margin-top: 12px; min-height: 1.2rem; font-size: 0.95rem; }
    .error { color: #b42318; }
    .ok { color: #067647; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Set a new password</h1>
    <p>Choose a strong password for your account.</p>
    <form id="reset-form" method="post" action="javascript:void(0)" autocomplete="on">
      <label for="new-password">New password</label>
      <input id="new-password" name="newPassword" type="password" minlength="8" required autocomplete="new-password" />
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password" />
      <button type="submit">Save password</button>
    </form>
    <div class="message" id="message" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
